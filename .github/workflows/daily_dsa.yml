name: Daily DSA Push

on:
  schedule:
    # 02:00 UTC = 07:30 AM IST daily
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Allows GitHub Actions to push commits

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Environment and Credentials
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

    - name: Run DSA Generator
      run: python scripts/daily_dsa.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add .
        # Commit only if there are new changes
        if git diff --staged --quiet; then
          echo "No new solutions generated today."
        else
          git commit -m "feat(dsa): auto-solve daily question [skip ci]"
          git push origin main
        fi